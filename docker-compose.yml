services:
  analyzer:
    build: .
    volumes:
      - ./shared:/app/shared
      - ./data:/app/data
    environment:
      SHARED_DIR: /app/shared
      DATA_DIR: /app/data
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      OLLAMA_HOST: ${OLLAMA_HOST:-host.docker.internal:11434}
      HF_TOKEN: ${HF_TOKEN:-}
    restart: unless-stopped
