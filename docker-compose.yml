services:
  analyzer:
    build: .
    volumes:
      - ${HOST_SHARED_DIR:-./shared}:/app/shared
      - ./data:/app/data
    environment:
      SHARED_DIR: /app/shared
      DATA_DIR: /app/data
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      OLLAMA_HOST: ${OLLAMA_HOST:-host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5}
      HF_TOKEN: ${HF_TOKEN:-}
      WATCHDOG_FORCE_POLLING: ${WATCHDOG_FORCE_POLLING:-0}
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    ports:
      - "8501:8501"
    volumes:
      - ${HOST_SHARED_DIR:-./shared}:/app/shared:ro
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      - analyzer
