name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.3

      - name: Install uv
        shell: bash
        run: |
          set -euo pipefail

          uv_version="$(
            python3 - <<'PY'
          import tomllib
          from pathlib import Path

          required = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )["tool"]["uv"]["required-version"]
          prefix = "=="
          if not required.startswith(prefix):
              raise SystemExit(
                  f"Unsupported [tool.uv].required-version: {required!r}"
              )
          print(required.removeprefix(prefix))
          PY
          )"

          target="x86_64-unknown-linux-gnu"
          archive="uv-${target}.tar.gz"
          base_url="https://github.com/astral-sh/uv/releases/download/${uv_version}"
          download_dir="${RUNNER_TEMP}/uv-download"
          install_dir="${RUNNER_TEMP}/uv-bin"

          mkdir -p "${download_dir}" "${install_dir}"
          curl --fail --show-error --silent --location \
            --output "${download_dir}/${archive}" \
            "${base_url}/${archive}"
          curl --fail --show-error --silent --location \
            --output "${download_dir}/sha256.sum" \
            "${base_url}/sha256.sum"

          (
            cd "${download_dir}"
            grep " \\*${archive}$" sha256.sum | sha256sum --check --strict
          )
          tar -xzf "${download_dir}/${archive}" \
            --strip-components=1 \
            -C "${install_dir}" \
            "uv-${target}/uv" \
            "uv-${target}/uvx"

          echo "${install_dir}" >> "${GITHUB_PATH}"
          echo "UV_PYTHON=3.12" >> "${GITHUB_ENV}"
          "${install_dir}/uv" --version

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: ruff format check
        run: uv run ruff format --check .

      - name: ruff lint
        run: uv run ruff check .

      - name: basedpyright
        run: uv run basedpyright

      - name: pytest
        run: uv run pytest

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
