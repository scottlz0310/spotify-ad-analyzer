[project]
name = "spotify-ad-analyzer"
version = "0.1.0"
description = "Spotify ad analyzer: transcription, diarization, voice embedding pipeline"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "watchdog>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-xdist>=3.6.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.0",
    "basedpyright>=1.29.0",
    "pre-commit>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ---------------------------------------------------------------------------
# ruff: lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",      # pydocstyle: docstrings not required
    "COM812", # trailing comma: conflicts with ruff format
    "ISC001", # implicit string concat: conflicts with ruff format
    "FIX002", # allow TODO comments
    "TD002",  # TODO missing author
    "TD003",  # TODO missing issue link
    "PLR0913", # many-arg functions are fine for DB helpers
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]  # assert + magic values OK in tests

# ---------------------------------------------------------------------------
# basedpyright: type checking (strictest)
# ---------------------------------------------------------------------------
[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "all"
reportMissingTypeStubs = false  # many ML libs lack stubs
reportAny = false               # sqlite3.Row.__getitem__ returns Any; stdlib limitation
reportImplicitStringConcatenation = false  # multi-line SQL strings are intentional
include = ["src", "tests"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = "-n auto --cov=src --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]
