[project]
name = "spotify-ad-analyzer"
version = "0.7.0"
description = "Spotify ad analyzer: transcription, diarization, voice embedding pipeline"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "faster-whisper>=1.2.1",
    "numpy>=2.4.3",
    "pyannote-audio>=4.0.4",
    "resemblyzer>=0.1.4",
    "setuptools<83",  # webrtcvad needs pkg_resources; removed in setuptools 81+
    "watchdog>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-xdist>=3.8.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.6",
    "basedpyright>=1.38.2",
    "pre-commit>=4.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ---------------------------------------------------------------------------
# ruff: lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",      # pydocstyle: docstrings not required
    "COM812", # trailing comma: conflicts with ruff format
    "ISC001", # implicit string concat: conflicts with ruff format
    "FIX002", # allow TODO comments
    "TD002",  # TODO missing author
    "TD003",  # TODO missing issue link
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S608"]        # assert + magic values + SQL injection OK in tests
"src/db.py" = ["PLR0913"]               # DB helpers legitimately need many args
"dashboard/**" = ["N999", "RUF001"]     # Streamlit page filenames + Japanese full-width parens in UI

# ---------------------------------------------------------------------------
# basedpyright: type checking (strictest)
# ---------------------------------------------------------------------------
[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "all"
reportMissingTypeStubs = false  # many ML libs lack stubs
# sqlite3.Row.__getitem__ returns Any (stdlib limitation); per-file suppression
# is not supported in basedpyright's pyproject.toml config — affected code is
# isolated to the private _row_to_* helpers in src/db.py.
reportAny = false
include = ["src", "tests"]
extraPaths = ["dashboard"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = "-n auto --cov=src --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
pythonpath = ["src", "dashboard"]

[tool.coverage.run]
branch = true
source = ["src"]
